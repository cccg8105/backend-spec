[project]
name = "backend-spec"
version = "1.1.0"
description = "CLI tool and framework for Spec-Driven Backend development with AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
backend-spec = "backend_spec.__main__:main"
spec = "backend_spec.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/backend_spec"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "backend_spec/templates"
"harnesses" = "backend_spec/harnesses"
"schemas" = "backend_spec/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "cli/**",
  "templates/**",
  "harnesses/**",
  "schemas/**",
  "README.md",
]
